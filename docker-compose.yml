services:
  db:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data

  php:
    build: ./docker/php
    env_file: .env
    volumes:
      - .:/var/www
    depends_on:
      - db

  nginx:
    image: nginx:1.30-alpine
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: 1
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

volumes:
  db_data:
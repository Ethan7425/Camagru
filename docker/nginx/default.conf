server {
    listen 80;
    server_name localhost;

    # Only public/ is reachable from the browser
    root /var/www/public;
    index index.php;

    # Must be >= PHP's post_max_size
    client_max_body_size 10M;

    # Subject: no log lines in the server console
    access_log off;

    # Every URL that isn't a real file goes to the front controller
    location / {
        try_files $uri /index.php?$query_string;
    }

    # Never execute PHP from the uploads folder
    location ^~ /uploads/ {
        location ~ \.php$ {
            return 403;
        }
    }

    # Hidden files (.env, .git, ...): 404 hides that they exist, and logs nothing
    location ~ /\. {
        return 404;
    }

    # Pass PHP files to the php container (PHP-FPM on port 9000)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

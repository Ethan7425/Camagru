; Errors: never shown to the user, written to a file instead
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/errors.log

; Don't advertise the PHP version in HTTP headers
expose_php = Off

; Uploads (webcam captures are sent as base64, which is ~33% bigger)
file_uploads = On
upload_max_filesize = 5M
post_max_size = 10M
memory_limit = 256M

; Sessions
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

date.timezone = UTC
